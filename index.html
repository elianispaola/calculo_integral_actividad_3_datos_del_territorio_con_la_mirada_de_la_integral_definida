<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulación de Caudal - Río Atrato (Quibdó)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Encabezado -->
    <header class="flex flex-col md:flex-row md:items-center justify-between border-b border-slate-700 pb-4 gap-4">
      <div>
        <h1 class="text-2xl font-bold text-sky-400">Simulación Hidrológica: Río Atrato</h1>
        <p class="text-sm text-slate-400">Estación Quibdó, Chocó | Mediciones de Caudal</p>
      </div>
      <div class="inline-flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 text-xs font-mono text-emerald-400">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        Simulador Activo
      </div>
    </header>

    <!-- Métricas -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <p class="text-xs text-slate-400 font-medium">Lectura Actual</p>
        <p id="currentFlow" class="text-2xl font-bold text-sky-400 mt-1">-- m³/s</p>
        <p id="currentTime" class="text-xs text-slate-400 mt-1">Esperando inicio...</p>
      </div>

      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <p class="text-xs text-slate-400 font-medium">Caudal Máximo Registrado</p>
        <p class="text-2xl font-bold text-amber-400 mt-1">2826,27 m³/s</p>
        <p class="text-xs text-slate-400 mt-1">2026-08-25 | 12:00</p>
      </div>

      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <p class="text-xs text-slate-400 font-medium">Variación Total</p>
        <p class="text-2xl font-bold text-emerald-400 mt-1">+8,07 %</p>
        <p class="text-xs text-slate-400 mt-1">Crecimiento en 36h</p>
      </div>
    </div>

    <!-- Gráfico -->
    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold text-slate-200">Comportamiento del Caudal en Tiempo Real</h2>
        <div class="flex gap-2">
          <button id="btnPlay" class="px-3 py-1.5 bg-sky-600 hover:bg-sky-500 text-white rounded-lg text-sm font-medium transition">
            Iniciar
          </button>
          <button id="btnPause" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium transition" disabled>
            Pausar
          </button>
          <button id="btnReset" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium transition">
            Reiniciar
          </button>
        </div>
      </div>
      <div class="relative h-72 md:h-96 w-full">
        <canvas id="flowChart"></canvas>
      </div>
    </div>

  </div>

  <script>
    const dataset = [
      { timestamp: '2026-08-24 06:00', flow: 2615.18 },
      { timestamp: '2026-08-24 12:00', flow: 2688.56 },
      { timestamp: '2026-08-24 18:00', flow: 2562.53 },
      { timestamp: '2026-08-25 06:00', flow: 2801.37 },
      { timestamp: '2026-08-25 12:00', flow: 2826.27 },
      { timestamp: '2026-08-25 18:00', flow: 2812.22 }
    ];

    let currentIndex = 0;
    let timer = null;

    const ctx = document.getElementById('flowChart').getContext('2d');
    const flowChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Caudal (m³/s)',
          data: [],
          borderColor: '#38bdf8',
          backgroundColor: 'rgba(56, 189, 248, 0.15)',
          fill: true,
          tension: 0.35,
          borderWidth: 3,
          pointRadius: 6,
          pointHoverRadius: 8,
          pointBackgroundColor: '#38bdf8'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: {
            grid: { color: '#334155' },
            ticks: { color: '#94a3b8' }
          },
          y: {
            min: 2500,
            max: 2900,
            grid: { color: '#334155' },
            ticks: { color: '#94a3b8' }
          }
        },
        plugins: {
          legend: { labels: { color: '#f8fafc' } }
        }
      }
    });

    const currentFlowEl = document.getElementById('currentFlow');
    const currentTimeEl = document.getElementById('currentTime');
    const btnPlay = document.getElementById('btnPlay');
    const btnPause = document.getElementById('btnPause');
    const btnReset = document.getElementById('btnReset');

    function updateStep() {
      if (currentIndex < dataset.length) {
        const point = dataset[currentIndex];
        flowChart.data.labels.push(point.timestamp);
        flowChart.data.datasets[0].data.push(point.flow);
        flowChart.update();

        currentFlowEl.textContent = `${point.flow.toLocaleString('es-CO')} m³/s`;
        currentTimeEl.textContent = point.timestamp;
        currentIndex++;
      } else {
        pauseSimulation();
      }
    }

    function startSimulation() {
      if (currentIndex >= dataset.length) resetSimulation();
      btnPlay.disabled = true;
      btnPlay.classList.add('opacity-50');
      btnPause.disabled = false;
      btnPause.classList.remove('opacity-50');

      updateStep();
      timer = setInterval(updateStep, 1200);
    }

    function pauseSimulation() {
      clearInterval(timer);
      timer = null;
      btnPlay.disabled = false;
      btnPlay.classList.remove('opacity-50');
      btnPause.disabled = true;
      btnPause.classList.add('opacity-50');
    }

    function resetSimulation() {
      pauseSimulation();
      currentIndex = 0;
      flowChart.data.labels = [];
      flowChart.data.datasets[0].data = [];
      flowChart.update();
      currentFlowEl.textContent = '-- m³/s';
      currentTimeEl.textContent = 'Esperando inicio...';
    }

    btnPlay.addEventListener('click', startSimulation);
    btnPause.addEventListener('click', pauseSimulation);
    btnReset.addEventListener('click', resetSimulation);
  </script>
</body>
</html>
